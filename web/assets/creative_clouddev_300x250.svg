      <stop offset="0%" style="stop-color:#3b0764;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6b21a8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333ea;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="300" height="250" fill="url(#cdGrad)" rx="6"/>
  <rect x="2" y="2" width="296" height="246" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" rx="5"/>
  
  <!-- Badge -->
  <rect x="24" y="20" width="115" height="22" rx="4" fill="#a855f7"/>
  <text x="81" y="35" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">CLOUD ENGINE</text>

  <!-- Title & Description -->
  <text x="24" y="80" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff">CloudDev Platform</text>
