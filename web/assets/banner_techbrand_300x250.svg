<svg xmlns="http://www.w3.org/2000/svg" width="300" height="250" viewBox="0 0 300 250">
  <defs>
    <linearGradient id="tbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="300" height="250" fill="url(#tbGrad)" rx="6"/>
  <rect x="2" y="2" width="296" height="246" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="5"/>

  <!-- Badge -->
  <rect x="24" y="20" width="105" height="22" rx="4" fill="#ffffff" fill-opacity="0.2"/>
  <text x="76" y="35" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">NEXTGEN 2026</text>

  <!-- Title & Description -->
  <text x="24" y="80" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff">TechBrand UltraBook</text>
  <text x="24" y="104" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#93c5fd">Extreme Performance.</text>
  <text x="24" y="122" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#93c5fd">Engineered for Developers.</text>

  <!-- Features -->
  <circle cx="28" cy="150" r="3" fill="#67e8f9"/>
  <text x="38" y="154" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" fill="#e0f2fe">32GB LPDDR5X RAM</text>

  <circle cx="28" cy="172" r="3" fill="#67e8f9"/>
  <text x="38" y="176" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" fill="#e0f2fe">20+ Hours Battery Life</text>

