      <stop offset="100%" style="stop-color:#b45309;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="300" height="250" fill="url(#crGrad)" rx="6"/>
  <rect x="2" y="2" width="296" height="246" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" rx="5"/>
  
